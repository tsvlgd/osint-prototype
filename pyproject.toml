[project]
name = "osint-framework"
version = "0.1.0"
description = "Prototype OSINT framework"
authors = [{ name = "Mehfooj Alam" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "python-whois",
    "pydantic",
    "python-dotenv",
    "duckduckgo-search>=8.1.1",
    "streamlit>=1.28.0",
    "reportlab>=4.0.0",
]

[project.scripts]
osint-fetch = "osint_framework:main" 

[tool.setuptools]
packages = ["osint_framework"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json"]

[tool.uv]
managed = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


